<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Arbitraje - MancoraBet</title>
    <link rel="stylesheet" href="/static/calculadora.css">
</head>
<body>

<div class="calc-container">

    <header class="calc-header">
        <div>
            <h2 id="match-name">Partido</h2>
            <p id="match-league-date" class="calc-subtitle"></p>
        </div>
        <div class="calc-summary">
            <div>Margen: <span id="margin-label">--</span></div>
            <div>ROI: <span id="roi-label">--</span></div>
        </div>
    </header>

    <section class="calc-grid">

        <!-- LOCAL -->
        <div class="calc-column">
            <h3>Local</h3>

            <!-- NUEVA FILA PERSONA -->
            <div class="calc-row">
                <label>Persona</label>
                <input id="home-person" type="text" placeholder="Nombre">
            </div>

            <div class="calc-row">
                <label>Casa</label>
                <input id="home-book" type="text">
            </div>
            <div class="calc-row">
                <label>Cuota</label>
                <input id="home-odd" type="number" step="0.01" min="1">
            </div>
            <div class="calc-row">
                <label>Apuesta</label>
                <input id="home-stake" type="number" step="0.01" min="0">
            </div>
            <div class="calc-row readonly">
                <label>Beneficio</label>
                <span id="home-profit">--</span>
            </div>
        </div>

        <!-- EMPATE -->
        <div class="calc-column">
            <h3>Empate</h3>

            <!-- NUEVA FILA PERSONA -->
            <div class="calc-row">
                <label>Persona</label>
                <input id="draw-person" type="text" placeholder="Nombre">
            </div>

            <div class="calc-row">
                <label>Casa</label>
                <input id="draw-book" type="text">
            </div>
            <div class="calc-row">
                <label>Cuota</label>
                <input id="draw-odd" type="number" step="0.01" min="1">
            </div>
            <div class="calc-row">
                <label>Apuesta</label>
                <input id="draw-stake" type="number" step="0.01" min="0">
            </div>
            <div class="calc-row readonly">
                <label>Beneficio</label>
                <span id="draw-profit">--</span>
            </div>
        </div>

        <!-- VISITA -->
        <div class="calc-column">
            <h3>Visita</h3>

            <!-- NUEVA FILA PERSONA -->
            <div class="calc-row">
                <label>Persona</label>
                <input id="away-person" type="text" placeholder="Nombre">
            </div>

            <div class="calc-row">
                <label>Casa</label>
                <input id="away-book" type="text">
            </div>
            <div class="calc-row">
                <label>Cuota</label>
                <input id="away-odd" type="number" step="0.01" min="1">
            </div>
            <div class="calc-row">
                <label>Apuesta</label>
                <input id="away-stake" type="number" step="0.01" min="0">
            </div>
            <div class="calc-row readonly">
                <label>Beneficio</label>
                <span id="away-profit">--</span>
            </div>
        </div>

    </section>

    <section class="calc-footer">
        <div class="calc-row">
            <label>Apuesta total</label>
            <input id="total-stake" type="number" step="1" min="1" value="100">
        </div>
        <div class="calc-row readonly">
            <label>Beneficio garantizado</label>
            <span id="guaranteed-profit">--</span>
        </div>
        <div class="calc-actions">
            <button id="recalc-btn">Recalcular</button>
            <a href="/" class="back-link">Volver a MancoraBet</a>
        </div>
    </section>

</div>

<script src="/static/calculadora.js"></script>
</body>
</html>
