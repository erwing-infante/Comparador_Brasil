<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Arbitraje - MancoraBet</title>
    <link rel="stylesheet" href="/static/calculadora.css">
</head>
<body>

<div class="calc-container">

    <header class="calc-header">
        <div>
            <h2 id="match-name">Partido</h2>
            <p id="match-league-date" class="calc-subtitle"></p>
        </div>

        <div class="calc-summary">
            <div>ROI: <span id="roi-label">--</span></div>
            <div id="user-badge" class="user-badge" style="display:none;"></div>
        </div>
    </header>

    <section class="calc-grid">

        <!-- LOCAL -->
        <div class="calc-column">
            <h3 class="calc-title">Local</h3>

            <div class="calc-row">
                <label>Persona</label>
                <input id="home-person" type="text" placeholder="Nombre">
            </div>

            <div class="calc-row">
                <label>Casa</label>
                <div class="book-picker">
                    <select id="home-book-select"></select>
                </div>
            </div>

            <div class="calc-row">
                <label>Cuota</label>
                <input id="home-odd" type="number" step="0.0001" min="1">
            </div>

            <div class="calc-row df-row">
                <label>Apuesta</label>
                <div class="df-box">
                    <label><input type="radio" name="homeMode" id="homeD" checked> D</label>
                    <label><input type="radio" name="homeMode" id="homeF"> F</label>
                </div>
                <input id="home-stake" class="stake-input" type="number" step="0.01" min="0" value="0">
            </div>

            <div id="home-extra"></div>
            <button type="button" id="home-add" class="back-link">+ Agregar casa</button>

            <div class="calc-row readonly">
                <label>Beneficio</label>
                <span id="home-profit">0.00</span>
            </div>
        </div>

        <!-- EMPATE -->
        <div class="calc-column">
            <h3 class="calc-title">Empate</h3>

            <div class="calc-row">
                <label>Persona</label>
                <input id="draw-person" type="text" placeholder="Nombre">
            </div>

            <div class="calc-row">
                <label>Casa</label>
                <div class="book-picker">
                    <select id="draw-book-select"></select>
                </div>
            </div>

            <div class="calc-row">
                <label>Cuota</label>
                <input id="draw-odd" type="number" step="0.0001" min="1">
            </div>

            <div class="calc-row df-row">
                <label>Apuesta</label>
                <div class="df-box">
                    <label><input type="radio" name="drawMode" id="drawD" checked> D</label>
                    <label><input type="radio" name="drawMode" id="drawF"> F</label>
                </div>
                <input id="draw-stake" class="stake-input" type="number" step="0.01" min="0" value="0">
            </div>

            <div id="draw-extra"></div>
            <button type="button" id="draw-add" class="back-link">+ Agregar casa</button>

            <div class="calc-row readonly">
                <label>Beneficio</label>
                <span id="draw-profit">0.00</span>
            </div>
        </div>

        <!-- VISITA -->
        <div class="calc-column">
            <h3 class="calc-title">Visita</h3>

            <div class="calc-row">
                <label>Persona</label>
                <input id="away-person" type="text" placeholder="Nombre">
            </div>

            <div class="calc-row">
                <label>Casa</label>
                <div class="book-picker">
                    <select id="away-book-select"></select>
                </div>
            </div>

            <div class="calc-row">
                <label>Cuota</label>
                <input id="away-odd" type="number" step="0.0001" min="1">
            </div>

            <div class="calc-row df-row">
                <label>Apuesta</label>
                <div class="df-box">
                    <label><input type="radio" name="awayMode" id="awayD" checked> D</label>
                    <label><input type="radio" name="awayMode" id="awayF"> F</label>
                </div>
                <input id="away-stake" class="stake-input" type="number" step="0.01" min="0" value="0">
            </div>

            <div id="away-extra"></div>
            <button type="button" id="away-add" class="back-link">+ Agregar casa</button>

            <div class="calc-row readonly">
                <label>Beneficio</label>
                <span id="away-profit">0.00</span>
            </div>
        </div>

    </section>

    <section class="calc-footer">

        <div class="calc-row total-row">
            <label>Apuesta total</label>
            <div class="df-box">
                <label><input type="radio" name="totalMode" id="totalD" checked> D</label>
                <label><input type="radio" name="totalMode" id="totalF"> F</label>
            </div>
            <input id="total-payout" type="number" step="0.01" min="0" value="100">
        </div>

        <div class="calc-row readonly">
            <label>Beneficio garantizado</label>
            <span id="guaranteed-profit">0.00</span>
        </div>

        <div class="calc-row readonly">
            <label>Inversión total</label>
            <span id="total-invest">0.00</span>
        </div>

        <div class="calc-actions">
            <button id="register-btn" style="background:#0b7a3d; display:none;">📌 Registrar</button>
            <a id="ops-link" href="/admin/operaciones" class="back-link" style="display:none;">Ver Operaciones</a>
            <a href="/" class="back-link">Volver a MancoraBet</a>
        </div>

        <p id="register-msg" style="margin:10px 0 0; color:#333;"></p>
    </section>

</div>

<script>
    window.MB_ROLE = "{{ role|default('viewer') }}";
    window.MB_USER = "{{ user|default('') }}";
</script>
<script src="/static/calculadora_v2.js"></script>
</body>
</html>
